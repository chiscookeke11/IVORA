services:
  - type: web
    name: ivora-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 8080
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: VTPASS_BASE_URL
        value: https://sandbox.vtpass.com
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_WS_URL
        sync: false
      - key: CLUBKASH_USERID
        sync: false
      - key: CLUBKASH_API_KEY
        sync: false
      - key: AGENT_PHONE_NUMBER
        sync: false
